name: Windows unsigned installer

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: Build-only uses reserved .invalid endpoints; configured-test requires real test services
        required: true
        type: choice
        options:
          - build-only
          - configured-test
        default: build-only
      download_test_origin:
        description: Required only for configured-test; HTTPS origin for the test download/update service
        required: false
        default: ""
        type: string
      mandatory_update_test_origin:
        description: Required only for configured-test; HTTPS origin for the mandatory-update policy service
        required: false
        default: ""
        type: string
      allowed_auth_origin:
        description: Required only for configured-test; approved HTTPS login origin
        required: false
        default: ""
        type: string
      test_release_id:
        description: Optional 32-character lowercase hex ID; reuse it to test upgrades across builds
        required: false
        default: ""
        type: string
      build_version:
        description: Use auto for a unique CI version, or provide an exact SemVer build version
        required: true
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: windows-unsigned-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout distribution tooling
        uses: actions/checkout@v7

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.28.5

      - name: Prepare build profile and version
        shell: pwsh
        env:
          BUILD_PROFILE_INPUT: ${{ inputs.build_profile }}
          DOWNLOAD_TEST_ORIGIN: ${{ inputs.download_test_origin }}
          MANDATORY_UPDATE_TEST_ORIGIN: ${{ inputs.mandatory_update_test_origin }}
          ALLOWED_AUTH_ORIGIN: ${{ inputs.allowed_auth_origin }}
          INPUT_TEST_RELEASE_ID: ${{ inputs.test_release_id }}
          INPUT_BUILD_VERSION: ${{ inputs.build_version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $profile = $env:BUILD_PROFILE_INPUT
          if ($profile -notin @('build-only', 'configured-test')) {
            throw 'build_profile must be build-only or configured-test.'
          }

          $pin = Get-Content -LiteralPath 'upstream.lock.json' -Raw | ConvertFrom-Json
          if ($env:INPUT_BUILD_VERSION -eq 'auto') {
            $utcDate = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $buildVersion = "$($pin.release.version).$utcDate.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          } else {
            $buildVersion = $env:INPUT_BUILD_VERSION
          }
          "BUILD_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($profile -eq 'build-only') {
            Write-Host 'Build-only mode: no application backend is configured. The build script will use reserved .invalid origins.'
            exit 0
          }

          function Assert-HttpsOrigin([string]$value, [string]$label) {
            $uri = $null
            if ([string]::IsNullOrWhiteSpace($value) -or -not [Uri]::TryCreate($value, [UriKind]::Absolute, [ref]$uri)) {
              throw "$label must be an absolute HTTPS origin."
            }
            if ($uri.Scheme -ne 'https' -or $uri.UserInfo -ne '' -or $uri.AbsolutePath -ne '/' -or $uri.Query -ne '' -or $uri.Fragment -ne '') {
              throw "$label must be an HTTPS origin without credentials, path, query, or fragment."
            }
          }

          Assert-HttpsOrigin $env:DOWNLOAD_TEST_ORIGIN 'download_test_origin'
          Assert-HttpsOrigin $env:MANDATORY_UPDATE_TEST_ORIGIN 'mandatory_update_test_origin'
          Assert-HttpsOrigin $env:ALLOWED_AUTH_ORIGIN 'allowed_auth_origin'

          $releaseId = $env:INPUT_TEST_RELEASE_ID
          if ([string]::IsNullOrWhiteSpace($releaseId)) {
            $releaseId = [guid]::NewGuid().ToString('N')
          }
          if ($releaseId -notmatch '^[0-9a-f]{32}$') {
            throw 'test_release_id must be exactly 32 lowercase hexadecimal characters.'
          }

          $configJson = @{ allowedAuthOrigins = @($env:ALLOWED_AUTH_ORIGIN) } | ConvertTo-Json -Compress
          $configLines = @(
            'DSH_DESKTOP_APP_ID=com.deepseek.harness',
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test',
            "DOWNLOAD_TEST_ORIGIN=$($env:DOWNLOAD_TEST_ORIGIN)",
            "DOWNLOAD_TEST_RELEASE_ID=$releaseId",
            "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=$($env:MANDATORY_UPDATE_TEST_ORIGIN)",
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='$configJson'"
          )
          New-Item -ItemType Directory -Force -Path 'config' | Out-Null
          Set-Content -LiteralPath 'config/windows.env' -Value $configLines -Encoding utf8NoBOM
          Write-Host 'Created configured-test packaging configuration; the file will not be uploaded.'

      - name: Build Windows installer from a physical short workspace
        shell: pwsh
        run: |
          # SUBST only changes the visible drive letter; Node/Electron tooling can
          # canonicalize it back to the original long GITHUB_WORKSPACE path. Copy
          # the source tree to a genuinely short physical path before building.
          $shortRoot = 'C:\w'
          if (Test-Path -LiteralPath $shortRoot) {
            throw "Short physical workspace $shortRoot already exists."
          }

          robocopy "$env:GITHUB_WORKSPACE" $shortRoot /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /XD .git .build node_modules
          $copyExitCode = $LASTEXITCODE
          if ($copyExitCode -ge 8) {
            throw "Failed to copy the source tree to $shortRoot (robocopy exit code $copyExitCode)."
          }

          $buildExitCode = 0
          try {
            Set-Location -LiteralPath $shortRoot
            $resolvedRoot = (node -p "process.cwd()").Trim()
            Write-Host "Physical build workspace: $resolvedRoot"
            if ($resolvedRoot -ne $shortRoot) {
              throw "Build process did not enter the physical short workspace: $resolvedRoot"
            }

            $probePath = Join-Path "$shortRoot\" '.build\upstream-dsh\apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts\win-unpacked\resources\runtime\primary-runtime\dependencies\python\Lib\site-packages\lxml\etree.cp312-win_amd64.pyd'
            Write-Host ("Expected lxml extension path length: {0}" -f $probePath.Length)
            if ($probePath.Length -ge 240) {
              throw "Physical short workspace path is still too long ($($probePath.Length) characters)."
            }

            if ($env:BUILD_PROFILE -eq 'build-only') {
              npm run build:windows -- --profile build-only --build-version "$env:BUILD_VERSION"
            } else {
              npm run build:windows -- --profile configured-test --config config/windows.env --build-version "$env:BUILD_VERSION"
            }
            $buildExitCode = $LASTEXITCODE
          } finally {
            Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          }

          if ($buildExitCode -ne 0) { exit $buildExitCode }

          $sourceArtifacts = Join-Path $shortRoot '.build\artifacts'
          $destinationArtifacts = Join-Path $env:GITHUB_WORKSPACE '.build\artifacts'
          if (-not (Test-Path -LiteralPath $sourceArtifacts)) {
            throw "Build succeeded but artifact directory is missing: $sourceArtifacts"
          }
          New-Item -ItemType Directory -Force -Path $destinationArtifacts | Out-Null
          robocopy $sourceArtifacts $destinationArtifacts /E /COPY:DAT /DCOPY:DAT /R:2 /W:1
          $artifactCopyExitCode = $LASTEXITCODE
          if ($artifactCopyExitCode -ge 8) {
            throw "Failed to copy installer artifacts back to the GitHub workspace (robocopy exit code $artifactCopyExitCode)."
          }
          # Robocopy uses exit codes 0-7 for success; normalize its code so the
          # GitHub PowerShell wrapper does not mistake a successful copy for failure.
          $global:LASTEXITCODE = 0

      - name: Upload unsigned installer and provenance
        uses: actions/upload-artifact@v7
        with:
          name: dsh-windows-${{ inputs.build_profile }}-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/artifacts/**
          if-no-files-found: error
          retention-days: 14
